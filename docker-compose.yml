version: "3"

services:
  backend:
    build: ./server
    container_name: backend
    env_file:
      - ./server/.env
    restart: always
    networks:
      - app-network

  frontend:
    build: ./client
    container_name: frontend
    restart: always
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - app-network

networks:
  app-network: